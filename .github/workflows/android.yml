name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      - name: Name the APK
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "reel7-${ver}.apk"
          sha256sum "reel7-${ver}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: reel7-apk
          path: reel7-*.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: reel7-*.apk
          name: REEL–7 ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            Sideload build of REEL–7 with the scratch engine.

            Install on Android 10 or newer (updated Android System WebView). Allow installs from this source when Android asks. If a newer build conflicts with an older one, uninstall REEL–7 first — music stored in the app is removed with it.

            The same player is on the web: https://iliasbousba21.github.io/tape07/
